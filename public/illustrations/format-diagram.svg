<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img"
     aria-label="An mzPeak file is a ZIP container holding Parquet data tables, a metadata table, a JSON index, and optional other members.">
  <style>
    .nm { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
    .ds { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pill { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600; }
  </style>

  <!-- container card -->
  <rect x="8" y="8" width="744" height="454" rx="16" fill="#ffffff" stroke="#dde2e7" stroke-width="1.5"/>

  <!-- title row -->
  <rect x="30" y="26" width="26" height="26" rx="5" fill="none" stroke="#4b545c" stroke-width="2"/>
  <path d="M30 34 h26 M43 26 v6" stroke="#4b545c" stroke-width="2" fill="none"/>
  <text x="66" y="45" class="nm" font-size="18" fill="#151a1e">run.mzpeak</text>
  <rect x="606" y="27" width="136" height="26" rx="13" fill="#f0f3ff"/>
  <text x="674" y="44" class="pill" font-size="12.5" fill="#3157e9" text-anchor="middle">ZIP container</text>
  <line x1="30" y1="68" x2="730" y2="68" stroke="#c5ccd3" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- row 1: data parquet -->
  <g>
    <rect x="30" y="84" width="48" height="48" rx="10" fill="#e1e7fe"/>
    <rect x="44" y="98"  width="6" height="20" rx="2" fill="#3157e9"/>
    <rect x="53" y="92"  width="6" height="26" rx="2" fill="#3157e9"/>
    <rect x="62" y="103" width="6" height="15" rx="2" fill="#3157e9"/>
    <text x="96" y="106" class="nm" font-size="16" fill="#151a1e">*_data.parquet</text>
    <text x="96" y="126" class="ds" font-size="13" fill="#6b757e">m/z + intensity (and ion mobility) as sorted, compressed columns</text>
  </g>

  <!-- row 2: metadata -->
  <g>
    <rect x="30" y="176" width="48" height="48" rx="10" fill="#f6ecfb"/>
    <rect x="44" y="190" width="24" height="6" rx="3" fill="#c503f4"/>
    <rect x="44" y="200" width="24" height="6" rx="3" fill="#c503f4"/>
    <rect x="44" y="210" width="16" height="6" rx="3" fill="#c503f4"/>
    <text x="96" y="198" class="nm" font-size="16" fill="#151a1e">metadata</text>
    <text x="96" y="218" class="ds" font-size="13" fill="#6b757e">instrument, software, samples, run description, CV declarations</text>
  </g>

  <!-- row 3: index json -->
  <g>
    <rect x="30" y="268" width="48" height="48" rx="10" fill="#e7f3e8"/>
    <path d="M52 280 q-6 0 -6 7 q0 5 -5 5 q5 0 5 5 q0 7 6 7" fill="none" stroke="#2e9e5b" stroke-width="2.4"/>
    <path d="M58 280 q6 0 6 7 q0 5 5 5 q-5 0 -5 5 q0 7 -6 7" fill="none" stroke="#2e9e5b" stroke-width="2.4"/>
    <text x="96" y="290" class="nm" font-size="16" fill="#151a1e">mzpeak_index.json</text>
    <text x="96" y="310" class="ds" font-size="13" fill="#6b757e">the manifest — which members exist and how to find them</text>
  </g>

  <!-- row 4: other members -->
  <g>
    <rect x="30" y="360" width="48" height="48" rx="10" fill="#f4f6f8" stroke="#c5ccd3" stroke-width="1.4" stroke-dasharray="3 3"/>
    <rect x="43" y="378" width="22" height="16" rx="2" fill="none" stroke="#6b757e" stroke-width="2"/>
    <rect x="49" y="372" width="22" height="16" rx="2" fill="#f4f6f8" stroke="#6b757e" stroke-width="2"/>
    <text x="96" y="382" class="nm" font-size="16" fill="#151a1e">Other members</text>
    <text x="96" y="402" class="ds" font-size="13" fill="#6b757e">optional: optical images, SDRF / ISA sample metadata, provenance</text>
  </g>
</svg>
