<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img"
     aria-label="An mzPeak archive: a ZIP container holding Parquet data columns, a metadata member, and a JSON index.">
  <defs>
    <style>
      .lbl { font: 600 13px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; fill:#1b1b1b; }
      .sub { font: 400 11px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; fill:#6a737d; }
      .tag { font: 700 11px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#fff; }
    </style>
  </defs>

  <!-- outer ZIP container -->
  <rect x="14" y="14" width="392" height="272" rx="16" fill="#fbfcfd" stroke="#cfd6de" stroke-width="2"/>
  <text x="34" y="40" class="lbl">file.mzpeak</text>
  <text x="320" y="40" class="sub">ZIP archive</text>

  <!-- spectra_data.parquet (columns) -->
  <rect x="34" y="56" width="352" height="92" rx="10" fill="#eef4ff" stroke="#1558d6" stroke-width="1.5"/>
  <rect x="34" y="56" width="92" height="22" rx="6" fill="#1558d6"/>
  <text x="44" y="72" class="tag">spectra_data.parquet</text>
  <!-- three column motifs -->
  <g>
    <rect x="52"  y="92" width="90" height="44" rx="6" fill="#dbe7ff"/>
    <text x="60" y="118" class="sub">m/z</text>
    <rect x="166" y="92" width="90" height="44" rx="6" fill="#dbe7ff"/>
    <text x="174" y="118" class="sub">intensity</text>
    <rect x="280" y="92" width="90" height="44" rx="6" fill="#dbe7ff"/>
    <text x="288" y="118" class="sub">spectrum_index</text>
  </g>

  <!-- metadata -->
  <rect x="34" y="160" width="220" height="50" rx="10" fill="#eafaf0" stroke="#1a7f37" stroke-width="1.5"/>
  <rect x="34" y="160" width="74" height="22" rx="6" fill="#1a7f37"/>
  <text x="44" y="176" class="tag">metadata</text>
  <text x="44" y="200" class="sub">instrument · samples · CV · run</text>

  <!-- index -->
  <rect x="266" y="160" width="120" height="50" rx="10" fill="#fff4e6" stroke="#bc4c00" stroke-width="1.5"/>
  <rect x="266" y="160" width="120" height="22" rx="6" fill="#bc4c00"/>
  <text x="276" y="176" class="tag">mzpeak_index.json</text>
  <text x="276" y="200" class="sub">the manifest</text>

  <!-- Other members -->
  <rect x="34" y="222" width="352" height="46" rx="10" fill="#f6f1ff" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="34" y="222" width="64" height="22" rx="6" fill="#8250df"/>
  <text x="44" y="238" class="tag">Other</text>
  <text x="44" y="259" class="sub">optional: optical images · SDRF / ISA sample metadata · provenance</text>
</svg>
