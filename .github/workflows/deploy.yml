# Build the VitePress site and deploy it to GitHub Pages.
# Settings → Pages → Build and deployment → Source: GitHub Actions.
# The custom domain (www.mzpeak.org) comes from public/CNAME.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run build
        env:
          # Build for the project-page URL (okohlbacher.github.io/mzpeak.org/) for now.
          # Remove this when serving from the custom domain www.mzpeak.org.
          GITHUB_PAGES: 'true'
      - name: Serve on github.io for now (drop custom domain CNAME)
        run: rm -f .vitepress/dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
